<!DOCTYPE html>
<html lang="tr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Stitch Dot Grid BG</title>
	<style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #202124;
        }

        .canvas {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .dot-grid {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .dot-grid .dot {
            fill: #777;
        }

        /* Mouse glow katmanı */
        .glow {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: radial-gradient(
                    300px circle at var(--mx, -500px) var(--my, -500px),
                    rgba(255, 255, 255, 0.06) 0%,
                    transparent 100%
            );
            mix-blend-mode: screen;
        }

        /* Dot'ları hover'da parlatan SVG mask katmanı */
        .dot-grid-hover {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
        }

        .dot-grid-hover .dot {
            fill: #b4b4b4;
        }

        .canvas:hover .dot-grid-hover {
            opacity: 1;
        }
	</style>
</head>
<body>
<div class="canvas">
	<!-- Normal dot grid -->
	<svg class="dot-grid" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
		<defs>
			<pattern id="dot-pattern" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
				<circle cx="1" cy="1" r="0.8" class="dot" />
			</pattern>
		</defs>
		<rect width="100%" height="100%" fill="url(#dot-pattern)" />
	</svg>

	<!-- Mouse glow (arka plan ışık efekti) -->
	<div class="glow"></div>

	<!-- Hover'da parlak dot'lar — mask ile sadece cursor yakınında görünür -->
	<svg class="dot-grid-hover" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
		<defs>
			<pattern id="dot-pattern-hover" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
				<circle cx="1" cy="1" r="0.8" class="dot" />
			</pattern>
			<radialGradient id="glow-mask-grad">
				<stop offset="0%" stop-color="white" />
				<stop offset="100%" stop-color="black" />
			</radialGradient>
			<mask id="glow-mask">
				<circle id="mask-circle" cx="-500" cy="-500" r="180" fill="url(#glow-mask-grad)" />
			</mask>
		</defs>
		<rect width="100%" height="100%" fill="url(#dot-pattern-hover)" mask="url(#glow-mask)" />
	</svg>
</div>

<script>
  const canvas = document.querySelector('.canvas');
  const glow = document.querySelector('.glow');
  const maskCircle = document.getElementById('mask-circle');

  canvas.addEventListener('mousemove', (e) => {
    const x = e.clientX;
    const y = e.clientY;

    // Glow arka plan efekti
    glow.style.setProperty('--mx', x + 'px');
    glow.style.setProperty('--my', y + 'px');

    // SVG mask — parlak dotların göründüğü alan
    maskCircle.setAttribute('cx', x);
    maskCircle.setAttribute('cy', y);
  });

  canvas.addEventListener('mouseleave', () => {
    glow.style.setProperty('--mx', '-500px');
    glow.style.setProperty('--my', '-500px');
    maskCircle.setAttribute('cx', -500);
    maskCircle.setAttribute('cy', -500);
  });

  // Zoom desteği (scroll ile zoom in/out — dot pattern otomatik scale olur)
  let scale = 1;
  const dotPattern = document.getElementById('dot-pattern');
  const dotPatternHover = document.getElementById('dot-pattern-hover');

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const delta = e.deltaY > 0 ? 0.95 : 1.05;
    scale = Math.max(0.2, Math.min(5, scale * delta));

    const size = 24 * scale;
    const r = 0.8 * scale;

    [dotPattern, dotPatternHover].forEach(p => {
      p.setAttribute('width', size);
      p.setAttribute('height', size);
      const circle = p.querySelector('circle');
      circle.setAttribute('cx', scale);
      circle.setAttribute('cy', scale);
      circle.setAttribute('r', r);
    });
  }, { passive: false });
</script>
</body>
</html>
